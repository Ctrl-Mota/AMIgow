version: '3.8'

services:
  amigow:
    build: .
    container_name: amigow
    ports:
      - "8080:8080"
    environment:
      - CONFIG_API_URL=http://your-config-api:9000/config
    volumes:
      - ./config.json:/root/config.json
    restart: unless-stopped
    networks:
      - amigow-network

networks:
  amigow-network:
    driver: bridge







